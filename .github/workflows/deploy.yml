name: Create Version and Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you have team sign-off'
        required: true

# Needed so this workflow can push the retrieved metadata back to main.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Dev Org
        env:
          SF_AUTH_URL: ${{ secrets.SF_DEV_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > ./authfile.txt
          sf org login sfdx-url --sfdx-url-file ./authfile.txt --alias devOrg --set-default
          rm ./authfile.txt

      # Publishes the bundle (creates the new version in the org) and retrieves
      # the resulting Bot/BotVersion/GenAiX metadata back into force-app/.
      - name: Publish authoring bundle (create version + deploy)
        run: sf agent publish authoring-bundle --api-name Version_Control --target-org devOrg

      # If the publish step changed any retrieved metadata files, commit and
      # push them straight to main so the repo never silently drifts behind
      # what's actually live in the org. If nothing changed, this is a no-op.
      - name: Commit retrieved metadata back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add force-app/
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore: sync metadata from published version [skip ci]"
            git push origin HEAD:main
          fi